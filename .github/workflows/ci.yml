name: CI

on:
  push:
    branches: [main, arena/11f4f537-test-program]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # pyyaml لتحليل docker-compose.yml، و crossplane لتحليل nginx.conf، و
      # dockerfile-parse لفحص صيغة ملفَي Dockerfile (تتخطّى الاختبارات نفسها عند غيابها).
      - name: Install pytest
        run: pip install pytest pyyaml crossplane dockerfile-parse

      - name: Run phase 1 tests
        run: python -m pytest tests/ -v

      - name: Validate setup.sh bash syntax
        run: bash -n scripts/setup.sh

      - name: Validate dev.sh bash syntax
        run: bash -n scripts/dev.sh

      - name: Validate setup.ps1 has no bash heredoc
        run: |
          if grep -F "<<'PY'" scripts/setup.ps1; then
            echo "setup.ps1 contains bash heredoc"; exit 1
          fi
          echo "setup.ps1 OK"

      - name: Install PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Run setup.sh (runtime .env generation)
        run: bash scripts/setup.sh

      - name: Verify .env generated by setup.sh
        run: test -f .env && diff .env.example .env && echo ".env matches .env.example"

      - name: Run setup.ps1 (runtime .env generation)
        run: pwsh -NoProfile -File scripts/setup.ps1

      - name: Verify .env remains after setup.ps1
        run: test -f .env && echo ".env exists after setup.ps1"

  # ---------------------------------------------------------------------------
  # وظيفة التشغيل بالحاويات: تتحقق فعليًا من docker-compose.yml ومن ملفَي Dockerfile
  # (بناء الصورتين، خدمة الواجهة على منفذ منشور، تمرير /api، وبقاء SQLite في
  # volume بعد إعادة الإنشاء). هذه البيئة الوظيفية فيها Docker، بعكس بيئة التطوير
  # الموثّقة في docs/ENVIRONMENT.md.
  # ---------------------------------------------------------------------------
  ops-docker:
    name: Ops — docker compose and dev scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest pyyaml crossplane dockerfile-parse

      - name: Report tool versions
        run: |
          docker --version
          docker compose version
          bash --version | head -1
          node --version
          npm --version
          python --version

      # pwsh اختيارية: اختبارا dev.ps1 يتخطّيان نفسيهما ذاتيًا عند غيابها.
      - name: Install PowerShell
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Validate compose files (config + override merge)
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose config --services
          docker compose -f docker-compose.yml -f docker-compose.override.yml config --quiet

      - name: Run ops tests (includes docker build + up + volume persistence)
        env:
          NEXUS_RUN_DOCKER_INTEGRATION: "1"
        run: |
          set +e
          python -m pytest tests/test_ops_containers.py -v -rs --tb=short > pytest-ops.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            # تشخيص مؤقت: نشر ناتج pytest كتعليق على الطلب (لا تُقرأ سجلات runner هنا).
            {
              echo "### ops-docker pytest (rc=$rc)"
              echo '```'
              tail -c 5000 pytest-ops.log
              echo ''
              echo '```'
            } > diag.md
            PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number' || true)
            if [ -n "$PR" ]; then
              gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file diag.md || echo "comment failed"
            else
              echo "no PR found for $GITHUB_REF_NAME"
            fi
            # وسم التشخيص عبر annotations (يُقرأ عبر API حتى لو مُنع نشر التعليق)
            tail -c 1800 pytest-ops.log | awk '{printf "%s%%0A", $0}' | sed 's/%%0A/%0A/g' > diag-oneline.txt
            printf '::error::ops pytest tail: %s\n' "$(cat diag-oneline.txt)"
            tail -40 pytest-ops.log
          fi
          exit "$rc"

      - name: Triage leftovers on failure
        if: failure()
        run: |
          docker ps -a || true
          docker volume ls || true
          docker images || true
