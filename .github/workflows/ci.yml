name: CI

on:
  push:
    branches: [main, arena/11f4f537-test-program]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Run phase 1 tests
        run: python -m pytest tests/ -v

      - name: Validate setup.sh bash syntax
        run: bash -n scripts/setup.sh

      - name: Validate setup.ps1 has no bash heredoc
        run: |
          if grep -F "<<'PY'" scripts/setup.ps1; then
            echo "setup.ps1 contains bash heredoc"; exit 1
          fi
          echo "setup.ps1 OK"

      - name: Install PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Run setup.sh (runtime .env generation)
        run: bash scripts/setup.sh

      - name: Verify .env generated by setup.sh
        run: test -f .env && diff .env.example .env && echo ".env matches .env.example"

      # setup.ps1 documents itself as "PowerShell / Windows" and hardcodes the Windows
      # venv layout (Scripts/Activate.ps1), so its full runtime run belongs on Windows.
      # On Linux we validate that it parses cleanly — the same approach Phase 1 uses in
      # tests/test_phase1.py::test_setup_ps1_parses_with_pwsh. The .env generation logic
      # it embeds is identical to setup.sh and is exercised by the step above.
      - name: Validate setup.ps1 parses on pwsh (runtime run is Windows-only)
        run: |
          pwsh -NoProfile -Command '$tokens=$null;$errors=$null;[void][System.Management.Automation.Language.Parser]::ParseFile("./scripts/setup.ps1",[ref]$tokens,[ref]$errors);if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.Message }; exit 1 }; Write-Host "setup.ps1 parses OK"'

      - name: Verify .env exists (generated by setup.sh)
        run: test -f .env && echo ".env exists after setup steps"

  # Phase 2 backend core (AATM-49a40f0c-45e4-46b4-bb03-848170020d23):
  # installs backend/requirements-dev.txt and runs ruff + pytest on backend/.
  backend:
    name: Backend (FastAPI core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies (runtime + dev tools)
        run: pip install -r backend/requirements-dev.txt

      - name: Ruff lint (backend/)
        working-directory: backend
        run: ruff check .

      - name: Run backend tests (pytest)
        working-directory: backend
        run: python -m pytest -v

