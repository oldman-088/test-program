name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Run phase 1 tests
        run: python -m pytest tests/ -v

      - name: Validate setup.sh bash syntax
        run: bash -n scripts/setup.sh

      - name: Validate setup.ps1 has no bash heredoc
        run: |
          if grep -F "<<'PY'" scripts/setup.ps1; then
            echo "setup.ps1 contains bash heredoc"; exit 1
          fi
          echo "setup.ps1 OK"

      - name: Install PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Run setup.sh (runtime .env generation)
        run: bash scripts/setup.sh

      - name: Verify .env generated by setup.sh
        run: test -f .env && diff .env.example .env && echo ".env matches .env.example"

      # setup.ps1 is Windows-oriented and expects the venv activation at
      # .venv/Scripts/Activate.ps1; POSIX venvs ship it at .venv/bin/Activate.ps1.
      # This link makes the script's activation call resolve on Linux (the call runs
      # in child scope, so it changes no behaviour); the requirements install then
      # proceeds with the PATH python, exactly as on a Windows runner.
      - name: Link POSIX venv layout for setup.ps1 (Scripts -> bin)
        run: ln -s bin .venv/Scripts

      - name: Run setup.ps1 (runtime .env generation)
        run: pwsh -NoProfile -File scripts/setup.ps1

      - name: Verify .env remains after setup.ps1
        run: test -f .env && echo ".env exists after setup.ps1"

  # البند 21 · المهمة AATM-984687b7 — شريحة الخلفية واختبار تطابق العقد.
  # وظيفة مستقلة: وظيفة `test` لا تُثبّت إلا pytest، واختبارات backend تحتاج
  # fastapi/sqlalchemy/alembic/httpx (انظر AGENTS.md · E49).
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend + test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run backend test suite (includes the API contract test)
        run: python -m pytest -v

      - name: Lint backend
        run: |
          pip install ruff
          ruff check .   # الإعداد في backend/ruff.toml
