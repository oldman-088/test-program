name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Run phase 1 tests
        run: python -m pytest tests/ -v

      - name: Validate setup.sh bash syntax
        run: bash -n scripts/setup.sh

      - name: Validate setup.ps1 has no bash heredoc
        run: |
          if grep -F "<<'PY'" scripts/setup.ps1; then
            echo "setup.ps1 contains bash heredoc"; exit 1
          fi
          echo "setup.ps1 OK"

      - name: Install PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Run setup.sh (runtime .env generation)
        run: bash scripts/setup.sh

      - name: Verify .env generated by setup.sh
        run: test -f .env && diff .env.example .env && echo ".env matches .env.example"

      - name: Run setup.ps1 (runtime .env generation)
        run: pwsh -NoProfile -File scripts/setup.ps1

      - name: Verify .env remains after setup.ps1
        run: test -f .env && echo ".env exists after setup.ps1"

  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Detect backend project
        id: detect
        run: |
          if [ -f backend/requirements.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::backend/requirements.txt not found on this branch; backend job steps skipped"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        if: steps.detect.outputs.present == 'true'
        run: |
          pip install -r backend/requirements.txt
          if [ -f backend/requirements-dev.txt ]; then
            pip install -r backend/requirements-dev.txt
          else
            pip install "pytest>=7.4"
          fi

      - name: Run backend tests
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: python -m pytest -v

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Detect frontend project
        id: detect
        run: |
          if [ -f frontend/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::frontend/package-lock.json not found on this branch; frontend job steps skipped"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node 20
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run build

      - name: Test frontend
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run test
