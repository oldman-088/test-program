name: Documentation Tests

on:
  push:
    branches: ["main", "arena/**", "docs/**", "fix/**", "feature/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-contract:
    name: Documentation contract tests (stdlib unittest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run documentation contract tests
        run: python3 -m unittest discover -s tests -t . -p 'test_*.py' -v
