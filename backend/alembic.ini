# إعدادات Alembic — البند 21 · المهمة AATM-984687b7.
# ``script_location`` يستخدم %(here)s حتى يعمل ``alembic`` من أي مجلد عمل.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s
version_path_separator = os
path_separator = os
# ملاحظة: تعطيل المسجّلات القائمة ممنوع ويُدار في ``alembic/env.py`` مباشرة.
# لا سرّ هنا: سلسلة الاتصال تُقرأ من متغير البيئة DATABASE_URL أو من الإعدادات.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
