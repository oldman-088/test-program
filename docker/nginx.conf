# =============================================================================
# docker/nginx.conf — إعداد خادم الواجهة الأمامية داخل حاوية nginx
# يُنسخ إلى /etc/nginx/conf.d/default.conf من docker/Dockerfile.frontend.
#
# تُضمَّن ملفات conf.d داخل كتلة http{} في nginx.conf الرسمي لصورة nginx:alpine،
# لذلك لا يحتوي هذا الملف على user/events/http بنفسه — فقط map + server.
#
# الوظيفة (البند 3 و 22 من المواصفة):
#   1) خدمة الملفات الثابتة المبنية من الواجهة (frontend/dist ← /usr/share/nginx/html).
#   2) توجيه /api إلى خدمة الخلفية باسم الخدمة "backend" على منفذها الداخلي 8000.
#   3) توجيه /ws إلى نفس الخلفية مع ترقية WebSocket (لوحة القيادة تستخدم /ws).
#
# عند التغيير: منفذ الاستماع هنا (listen 8080) يجب أن يطابق EXPOSE/HEALTHCHECK في
# Dockerfile.frontend وقيمة هدف النشر في docker-compose.yml (3000:8080).
# =============================================================================

# ترقية WebSocket: $connection_upgrade = upgrade عند وجود ترويسة Upgrade، وإلا close.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # IPv6 غير مُفعّل افتراضيًا في شبكات Docker، و `listen [::]` يفشل الإقلاع عندها؛
    # النشر على المضيف يتولّاه Docker نفسه. فعّل IPv6 في شبكة Compose ثم أضِف السطر
    # `listen [::]:8080;` إن كنت بحاجة إليه داخل الحاوية.
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # حدود الطلبات وأزمنة الانتظار نحو الخلفية (مهام طويلة/بثّ أحداث).
    client_max_body_size 32m;
    proxy_connect_timeout 5s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # DNS المدمج في شبكات Docker: 127.0.0.11
    # استخدام متغيّر في proxy_pass مع resolver يؤجّل حلّ اسم الخدمة إلى وقت الطلب،
    # فلا يعجز nginx عن الإقلاع إذا لم تكن حاوية الخلفية جاهزة بعدُ عند
    # `docker compose up` — النتيجة 502 مؤقتة بدل حاوية ميتة.
    # البديل الأبسط (يتطلب أن تكون الخلفية تعمل قبل nginx): احذف السطور الثلاثة
    # التالية واستخدم proxy_pass http://backend:8000; حرفيًا في كل موقع.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $nexus_backend "backend:8000";

    # ------------------------------------------------------------------
    # فحص صحة حاوية nginx نفسها — يستخدمه HEALTHCHECK في Dockerfile.frontend
    # ------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------------
    # /api/… → خدمة الخلفية
    # ^~ تمنع مطابقة regex الخاصة بالأصول الثابتة قبل هذا الموقع (وإلا صار
    # طلب مثل /api/openapi.json يخدم ملفًا ثابتًا بدل أن يُمرَّر للخلفية).
    # البادئة /api تُمرَّر كما هي دون rewrite، لأن مسارات REST في المشروع
    # مُركَّبة تحت API_PREFIX=/api (راجع .env.example).
    # ------------------------------------------------------------------
    location ^~ /api/ {
        proxy_pass         http://$nexus_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        # بثّ فوري للردود المُجَزَّأة (SSE / تحميل طويل) بدل التخزين المؤقت.
        proxy_buffering    off;
        # إعادة إرسال الطلب عند تعذّر الاتصال بالخلفية (حاوية تعيد الإقلاع).
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # /api بدون شرطة مائلة الأخيرة: تحويل صريح بدل السقوط إلى SPA fallback.
    location = /api {
        return 301 /api/;
    }

    # ------------------------------------------------------------------
    # /ws/… → خدمة الخلفية مع ترقية WebSocket (أحداث لوحة القيادة)
    # ------------------------------------------------------------------
    location ^~ /ws/ {
        proxy_pass         http://$nexus_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # اتصالات طويلة: أزمنة انتظار أكبر بكثير من /api.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # ------------------------------------------------------------------
    # الأصول المبنية (ممهّاة عادةً): تخزين مؤقت طويل
    # ------------------------------------------------------------------
    location ~* \.(?:js|mjs|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico|map)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # لا نخدم ملفات نقطة المخفية (.git, .env …) إن تسرّبت إلى dist/.
    location ~ /\. {
        deny all;
    }

    # ------------------------------------------------------------------
    # SPA fallback: كل مسار ليس ملفًا أو مجلدًا حقيقيًا يعود إلى index.html
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;
}
